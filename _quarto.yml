project:
  type: book
  output-dir: _book

bibliography: Referencias.bib

website:
  favicon: LOGOunach.png
  reader-mode: true
  open-graph: true
  twitter-card: true
  repo-url: https://github.com/maribecrurod-art/TESIS-Q
  repo-actions: [edit, issue, source]
  page-navigation: true
  search:
    location: sidebar
    type: overlay
  sidebar:
    logo: LOGOunach.png
    style: floating
    collapse-level: 2
    border: true
    search: true
  comments:
    hypothesis: true

book:
  title: "Tesis HMM vs CNN"
  reader-mode: true
  language: es
  date: today
  output-file: "Tesis_MBCR"
  image: LOGOunach.png
  cover-image: LOGOunach.png
  sharing: [twitter, facebook]
  downloads: [pdf, epub]
  favicon: LOGOunach.png
  chapters: 
    - index.qmd
    - objetivos.qmd
    - capitulo1.qmd
    - capitulo2.qmd
    - capitulo3.qmd
    - capitulo4.qmd
    - capitulo5.qmd
    - conclusiones.qmd
    - referencias.qmd

comments:
  hypothesis: true

format:
  html:
    theme:
      dark: darkly
      light: cerulean
    css: styles.css
    highlight-style: a11y
    lang: es
    html-math-method: mathjax
    grid:
      sidebar-width: 300px
      body-width: 900px
      margin-width: 300px
      gutter-width: 1.5rem
    code-copy: true
    code-fold: true
    toc: true
    toc-location: right

  pdf:
    lang: es
    include-in-header: 
      - packa.tex
    template-partials: 
      - before-body.tex
    documentclass: scrreprt
    papersize: us-letter
    titlegraphic: LOGOunach.png
    institution: Benemérita Universidad Autónoma de Chiapas
    email: mariana.cruz68@unach.mx
    keep-tex: true
    toc: true
    link-citations: true
    code-fold: true
    fig-align: center
    fig-cap-location: bottom 

editor: visual